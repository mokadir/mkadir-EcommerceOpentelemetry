rootProject.name = 'reactnativeapp'

dependencyResolutionManagement {
  versionCatalogs {
    reactAndroidLibs {
      from(files(new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), "../gradle/libs.versions.toml")))
    }
  }
}

def expoPkg = file("$rootDir/node_modules/expo/package.json")
if (!expoPkg.exists()) {
    throw new GradleException("Expo package not found in node_modules. Ensure 'npm install' was run and dependencies are present.")
}
apply from: new File(expoPkg.parentFile, "scripts/autolinking.gradle")
useExpoModules()

// Support both old and new package names for CLI Android platform
File cliPlatformAndroidPkg = file("$rootDir/node_modules/@react-native-community/cli-platform-android/package.json")
if (!cliPlatformAndroidPkg.exists()) {
    cliPlatformAndroidPkg = file("$rootDir/node_modules/@react-native/cli-platform-android/package.json")
}
if (!cliPlatformAndroidPkg.exists()) {
    throw new GradleException("CLI platform android package not found under node_modules. Ensure dependencies include @react-native/cli-platform-android or @react-native-community/cli-platform-android.")
}
def nativeModulesGradleFile = new File(cliPlatformAndroidPkg.parentFile, "native_modules.gradle")
if (!nativeModulesGradleFile.exists()) {
    nativeModulesGradleFile = new File(cliPlatformAndroidPkg.parentFile.parentFile, "native_modules.gradle")
}
if (!nativeModulesGradleFile.exists()) {
    throw new GradleException("Could not find native_modules.gradle in cli-platform-android package or parent module. Ensure correct dependency version is installed.")
}
apply from: nativeModulesGradleFile
applyNativeModulesSettingsGradle(settings)

include ':app'
includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile())
